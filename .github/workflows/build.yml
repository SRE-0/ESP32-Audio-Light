name: Build

on:
  push:

permissions:
  contents: read

jobs:
  linux:
    name: Linux (${{ matrix.name }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu-Debian
            slug: ubuntu-debian
            image: ubuntu:22.04
            install: >-
              apt-get update &&
              DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends
              build-essential pkg-config libfftw3-dev libpipewire-0.3-dev
          - name: Fedora
            slug: fedora
            image: fedora:latest
            install: >-
              dnf install --assumeyes
              gcc-c++ make pkgconf-pkg-config pipewire-devel fftw-devel tar gzip
          - name: Arch
            slug: arch
            image: archlinux:latest
            install: >-
              pacman -Syu --noconfirm --needed
              base-devel pkgconf libpipewire fftw
          - name: Alpine
            slug: alpine
            image: alpine:latest
            install: >-
              apk add --no-cache
              build-base pkgconf pipewire-dev fftw-dev

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build in ${{ matrix.name }}
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            "${{ matrix.image }}" \
            sh -lc '${{ matrix.install }} &&
              make --always-make linux &&
              tar -czf "audio-light-sync-${{ matrix.slug }}-x86_64.tar.gz" audio_light_sync'

      - name: Upload ${{ matrix.name }} executable
        uses: actions/upload-artifact@v4
        with:
          name: audio-light-sync-${{ matrix.slug }}-x86_64
          path: audio-light-sync-${{ matrix.slug }}-x86_64.tar.gz
          if-no-files-found: error

  windows:
    name: Windows
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install MSYS2 build dependencies
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            make
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-fftw

      - name: Build Windows version
        shell: msys2 {0}
        run: make --always-make windows CXX_WIN=g++

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: audio-light-sync-windows-x86_64
          path: |
            audio_light_sync.exe
            libfftw3f-3.dll
          if-no-files-found: error
